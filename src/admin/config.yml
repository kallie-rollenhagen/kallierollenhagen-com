backend:
    name: github
    repo: kallie-rollenhagen/kallierollenhagen-com
    branch: main
    base_url: https://decap-proxy.hallenj.workers.dev
    auth_endpoint: /auth

media_folder: "src/assets/images/"
public_folder: "/assets/images"
site_url: "https://kallierollenhagen.com"
logo:
  src: "/assets/images/Kallie-Rollenhagen-ski-headshot.jpeg"
  show_in_header: true

image_fields: &image_fields
  - { label: File, name: file, widget: image }
  
  - { label: Alt Text, name: alt, widget: string, required: false }
  
  - { label: Caption, name: caption, widget: string, required: false }
  
  - label: Cropping Focal Point - X
    name: focal_x
    widget: number
    value_type: int
    min: 0
    max: 100
    default: 50
    required: false
    hint: Left = 0 %, right = 100% (only applies if Image Fit = Cover)
  
  - label: Cropping Focal Point - Y
    name: focal_y
    widget: number
    value_type: int
    min: 0
    max: 100
    default: 50
    required: false
    hint: Top = 0%, bottom = 100% (only applies if Image Fit = Cover)

gallery_field: &gallery_field
  label: Gallery
  name: gallery
  widget: object
  
  fields:  
    - label: Gallery Type
      name: type
      widget: select
      options:
        - grid
        - masonry

    - label: Lightbox
      name: lightbox
      widget: boolean
      default: false

    - label: Rows
      name: rows
      widget: list
      fields:
        
        - label: Layout
          name: layout
          widget: select
          options:
            - halves
            - thirds
            - left-wide
            - right-wide
            - full-width
        
        - label: Image Fit
          name: object_fit
          widget: select
          default: contain
          options:
            - { label: Contain - fit entire images inside cells (image height my not align), value: contain }
            - { label: Cover - fill entire cells with images (images may be cropped), value: cover }
        
        - label: Row Bottom Margin
          name: row_margin_bottom
          widget: select
          default: large
          required: false
          options:
            - { label: Large, value: large }
            - { label: Small, value: small }


        - label: Elements
          name: elements
          widget: list
          types:

            - label: Image
              name: image
              widget: object
              fields: *image_fields
                
            - label: Text
              name: text
              widget: object
              fields:
                - { label: Text Content, name: text, widget: 'richtext' }
            
            - label: Spacer
              name: spacer
              widget: object
              fields:
                - label: Spacer
                  name: spacer
                  widget: hidden
                  default: true

collections:
  - name: pages
    label: Pages
    
    files:
      - label: Home Page
        name: home
        file: src/content/index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: SEO Description, name: seoDescription, widget: string }
          - label: Slides
            name: slides
            widget: list
            fields: *image_fields

      - label: Design Page
        name: design
        file: src/content/design.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
          - { label: SEO Description, name: seoDescription, widget: string }
          - label: Design Projects
            name: design_projects
            widget: list
            field:
              label: Project
              name: project
              widget: relation
              collection: projects
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
      - label: MCAD Page
        name: mcad
        file: src/content/mcad.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
          - { label: SEO Description, name: seoDescription, widget: string }
          - label: Design Projects
            name: design_projects
            widget: list
            field:
              label: Project
              name: project
              widget: relation
              collection: projects
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
      - label: Sketchbook Page
        name: sketchbook
        file: src/content/sketchbook.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
          - { label: SEO Description, name: seoDescription, widget: string }
          - *gallery_field
      - label: Photography Page
        name: photography
        file: src/content/photography.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
          - { label: SEO Description, name: seoDescription, widget: string }
          - *gallery_field
      - label: About Page
        name: about
        file: src/content/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
          - { label: SEO Description, name: seoDescription, widget: string }
          - label: "Photo"
            name: "photo"
            widget: "object"
            fields:
              - {label: "File", name: "file", widget: "image"}
              - {label: "Alt Text", name: "alt", widget: "string"}
              - {label: "Credit", name: "credit", widget: "string"}
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - {label: "Text", name: "text", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - {label: "Bio", name: "bio", widget: "richtext"}
          - label: "Ideal Clients"
            name: "clients"
            widget: "list"
            fields:
              - label: Client
                name: client
                widget: string
          - label: "Education"
            name: "education"
            widget: list
            fields:
              - {label: "School", name: "school", widget: "string"}
              - {label: "Degree", name: "degree", widget: "string"}

  - name: "projects"
    label: "Design Projects"
    folder: "src/content/design/"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the page URL, e.g. 'example' becomes example.html" }
      - { label: SEO Description, name: seoDescription, widget: string }
      - label: Publish
        name: publish
        widget: boolean
        default: false
      - { label: "Roles Played by Kallie", name: "roles_played", widget: "string" }
      - label: "Credits"
        name: "credits"
        widget: "list"
        fields:
          - {label: "Role", name: "role", widget: "string"}
          - {label: "Person or Organization", name: "person", widget: "string"}
          - {label: "URL", name: "url", widget: "string", required: false}
      - {label: "Project Description", name: "project_description", widget: "richtext"}
      - label: "Main Image"
        name: "main_image"
        widget: "object"
        fields: *image_fields
      - label: "Thumbnail Image"
        name: "thumbnail_image"
        widget: "object"
        fields: *image_fields
      - *gallery_field

  - name: admin
    label: Site Administration
    files:

      - label: Site Settings
        name: site_settings
        file: src/_data/site.json
        fields:
          - label: Site Title
            name: title
            widget: string
          - label: Site Description
            name: description
            widget: string
          - label: Site Email
            name: email
            widget: string
          - label: Navigation Menu
            name: navigation
            widget: list
            field:
              label: Page
              name: page
              widget: relation
              collection: pages
              search_fields: ["title"]
              value_field: "id"
              display_fields: ["title"]
          - label: Google Analytics ID
            name: analyticsId
            widget: string

      - label: README
        name: readme
        file: README.md
        delete: false
        fields:
          - label: Content
            name: body
            widget: markdown

      - label: Custom CSS
        name: custom_css
        file: src/assets/css/custom-css.md

        fields:
          - label: CSS
            name: body
            widget: code
            default_language: css
            allow_language_selection: false
            output_code_only: true